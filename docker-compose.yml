services:
  postgres:
    image: postgres:16-alpine
    container_name: elaraa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: elaraa
      POSTGRES_PASSWORD: elaraa_dev_password
      POSTGRES_DB: elaraa_ecommerce
    ports:
      - "5432:5432"
    volumes:
      - elaraa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elaraa -d elaraa_ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  elaraa_postgres_data:
